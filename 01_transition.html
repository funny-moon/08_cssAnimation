<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box01 {
        width: 100px;
        height: 100px;
        background: red;
        margin: 50px auto;
        transition: 1s;
      }
      .box01:hover {
        background: forestgreen;
      }
      .box02 {
        width: 100px;
        height: 100px;
        background: blue;
        /* margin: 0 auto; */
        /* transition-property: all;
        transition-duration: 1s;
        transition-delay: 2s;
        transition-timing-function: cubic-bezier(0.075, 0.82, 0.165, 1); */
        transition:
          width 1s cubic-bezier(0.77, -0.72, 0, 1.69),
          background 2s ease-in,
          border-radius 2s cubic-bezier(0, 1.87, 1, 1);
      }
      .box02:hover {
        width: 500px;
        background: yellow;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box01"></div>
    <div class="box02"></div>
  </body>
</html>
